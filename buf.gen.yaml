version: v1
managed:
  enabled: true
plugins:
  # JavaScript/TypeScript for NestJS
  - plugin: buf.build/community/timostamm-protobuf-ts:v2.7.0
    out: ./generated/ts
    opt:
      - module_name=@org/proto-contracts
  # Java for Spring Boot
  - plugin: buf.build/community/grpc-java:v1.56.0
    out: ./generated/java
  - plugin: buf.build/community/protoc-gen-java:v3.21.0
    out: ./generated/java
